<!DOCTYPE html>
<html lang="en">
<head>

    <title>Marathi Matrimony</title>

<body>

        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>
    <button onclick="searchProfile()">Search</button>
</section>

<section class="profiles">
    <h2>Featured Profiles</h2>

    <div class="card">
        <h3>Rahul Patil</h3>
        <p>Age: 28 | Engineer | Pune</p>
    </div>

    <div class="card">
        <h3>Priya Deshmukh</h3>
        <p>Age: 25 | Doctor | Mumbai</p>
    </div>

    <div class="card">
        <h3>Amit Joshi</h3>
        <p>Age: 30 | Businessman | Nashik</p>
    </div>

</section>

<footer>
    <p>© 2026 Marathi Matrimony | All Rights Reserved</p>
</footer>

<script src="script.js"></script>
</body>
</html>
